
name: C++ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libgtest-dev

      - name: Build application
        run: make

      - name: Run Python integration tests
        run: make test

      - name: Run C++ unit tests
        run: make unit-test
